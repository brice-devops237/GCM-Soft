#######################################################################
# APPLICATION
#######################################################################

# Nom de l'application Spring Boot
spring.application.name=GCM-Soft

# Port HTTP du serveur
server.port=9111

# Profil actif ("prod", "dev", "test"…)
spring.profiles.active=prod


#######################################################################
# DATASOURCE MYSQL
#######################################################################

# URL de connexion MySQL
# -> createDatabaseIfNotExist=true : crée automatiquement la base si elle n'existe pas
# -> useSSL=false : désactive SSL (utile en dev)
# -> serverTimezone=UTC : pour éviter les warnings de fuseau horaire
# -> allowPublicKeyRetrieval=true : nécessaire si MySQL utilise caching_sha2_password
spring.datasource.url=jdbc:mysql://localhost:3306/company_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true

# Identifiants de connexion
spring.datasource.username=root
spring.datasource.password=

# Driver JDBC pour MySQL 8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#######################################################################
# JPA / HIBERNATE
#######################################################################

# Mode de gestion du schéma
# Options :
# - validate : vérifie que les tables existent (ne modifie rien)
# - update   : crée les tables manquantes et met à jour les existantes
# - create   : supprime les tables existantes et les recrée
# - create-drop : supprime et recrée les tables à chaque démarrage et à l'arrêt
spring.jpa.hibernate.ddl-auto=update

# Dialecte Hibernate pour MySQL 8 et Hibernate 7
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Affichage des requêtes SQL
spring.jpa.show-sql=false

# Formatage du SQL (désactivé pour améliorer la performance)
spring.jpa.properties.hibernate.format_sql=false

# Fermer la session après la requête pour éviter les connexions longues
spring.jpa.open-in-view=false


#######################################################################
# POOL DE CONNEXIONS HIKARI
#######################################################################

# Taille maximale et minimale du pool de connexions
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=10


#######################################################################
# FLYWAY (MIGRATIONS DE BASE DE DONNÉES)
#######################################################################

# Activer Flyway
spring.flyway.enabled=true

# Emplacement des scripts de migration
spring.flyway.locations=classpath:db/migration

# Crée une baseline si la base contient déjà des tables (utile pour projet existant)
spring.flyway.baseline-on-migrate=true

# Valide la structure de la base avant d'appliquer les migrations
spring.flyway.validate-on-migrate=true


#######################################################################
# JWT (AUTHENTIFICATION)
#######################################################################

# Clé secrète pour signer les tokens (en production : variable d'environnement)
app.jwt.secret=GCM-Soft-JWT-Secret-ChangeMe-In-Production-Minimum-32-Chars

# Durée de validité du token (24 h en ms)
app.jwt.expiration-ms=86400000

# Nom du cookie pour le token (connexion formulaire)
app.jwt.cookie-name=token
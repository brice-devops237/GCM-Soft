# Profil dev : rechargement automatique (DevTools)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
# Détecter les changements dans target/classes plus souvent (redémarrage après mvn compile)
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms

# Thymeleaf : pas de cache pour voir les changements de templates tout de suite
spring.thymeleaf.cache=false

# Logs un peu plus verbeux en dev (optionnel)
logging.level.org.springframework.web=INFO

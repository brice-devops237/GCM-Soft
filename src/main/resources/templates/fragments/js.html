  <!-- Déconnexion : modal de confirmation puis redirection (replace = pas de retour arrière) -->
  <script th:inline="javascript">
    window.confirmLogout = function(link) {
      var url = (link && link.getAttribute('data-logout-url')) || /*[[@{/logout}]]*/ '/logout';
      if (typeof window.ConfirmModal !== 'undefined' && document.getElementById('modalConfirm')) {
        window.ConfirmModal.show('Déconnexion', 'Voulez-vous vraiment vous déconnecter ?', function() {
          window.location.replace(url);
        }, 'btn-danger');
      } else {
        if (!confirm('Voulez-vous vraiment vous déconnecter ?')) return false;
        window.location.replace(url);
      }
      return false;
    };
  </script>

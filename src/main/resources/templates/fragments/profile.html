<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Fragment Profil utilisateur -->
    <li th:fragment="profile" class="nav-item navbar-dropdown dropdown-user dropdown">

        <a class="nav-link dropdown-toggle hide-arrow p-0" href="javascript:void(0);" data-bs-toggle="dropdown">
            <div class="avatar avatar-online">
                <img th:src="@{/assets/img/avatars/1.png}" alt="Avatar" class="rounded-circle" />
            </div>
        </a>

        <ul class="dropdown-menu dropdown-menu-end">
            <!-- User info -->
            <li>
                <a class="dropdown-item" th:href="@{/profile}">
                    <div class="d-flex">
                        <div class="flex-shrink-0 me-3">
                            <div class="avatar avatar-online">
                                <img th:src="@{/assets/img/avatars/1.png}" alt="Avatar"
                                    class="w-px-40 h-auto rounded-circle" />
                            </div>
                        </div>
                        <div class="flex-grow-1">
                            <h6 class="mb-0" th:text="${!#strings.isEmpty(username) ? username : 'Utilisateur'}">Utilisateur</h6>
                            <small class="text-body-secondary" th:text="${!#strings.isEmpty(role) ? role : 'Utilisateur'}">Utilisateur</small>
                        </div>
                    </div>
                </a>
            </li>

            <li>
                <div class="dropdown-divider my-1"></div>
            </li>

            <!-- Profile -->
            <li>
                <a class="dropdown-item" th:href="@{/profile}">
                    <i class="icon-base bx bx-user icon-md me-3"></i>
                    <span>Mon profil</span>
                </a>
            </li>

            <!-- Settings -->
            <li>
                <a class="dropdown-item" th:href="@{/settings}">
                    <i class="icon-base bx bx-cog icon-md me-3"></i>
                    <span>Paramètres</span>
                </a>
            </li>

            <li>
                <div class="dropdown-divider my-1"></div>
            </li>

            <!-- Logout : dialogue de confirmation puis déconnexion (replace = pas de retour arrière) -->
            <li>
                <a class="dropdown-item text-danger" href="javascript:void(0);" role="button"
                   th:attr="data-logout-url=@{/logout}"
                   onclick="return confirmLogout(this);">
                    <i class="icon-base bx bx-power-off icon-md me-3"></i>
                    <span>Déconnexion</span>
                </a>
            </li>
        </ul>
    </li>

</body>

</html>

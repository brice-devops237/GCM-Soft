<!doctype html>
<html lang="fr" class="layout-wide customizer-hide" dir="ltr" data-skin="default" data-assets-path="/assets/"
      data-template="vertical-menu-template" data-bs-theme="light">

<!-- Inclure le head via fragment Thymeleaf -->
<head th:replace="~{fragments/head :: head}"></head>

<body>

<div class="authentication-wrapper authentication-cover">
    <div class="authentication-inner row m-0">
        <!-- Image de gauche (visible sur grand écran) -->
        <div class="d-none d-lg-flex col-lg-7 col-xl-8 align-items-center p-5">
            <div class="w-100 d-flex justify-content-center">
                <img th:src="@{/assets/img/illustrations/boy-with-rocket-light.png}" 
                     class="img-fluid"
                     alt="Illustration GCM Soft" width="550"/>
            </div>
        </div>
        <!-- /Image de gauche -->

        <!-- Formulaire de connexion -->
        <div class="d-flex col-12 col-lg-5 col-xl-4 align-items-center authentication-bg p-6 p-sm-12">
            <div class="w-px-400 mx-auto mt-8 mt-sm-12">
                <h4 class="mb-1 text-center">GCM Soft ! 👋</h4>
                <p class="mb-6 text-center">Connectez-vous pour accéder à votre espace</p>

                <!-- Messages flash affichés en toast (pas d'alerte inline) -->
                <div th:if="${error}" class="d-none" data-flash-toast="error" th:data-message="${error}"></div>
                <div th:if="${success}" class="d-none" data-flash-toast="success" th:data-message="${success}"></div>

                <!-- Formulaire de login : POST vers /auth/login pour authentification JWT -->
                <form th:action="@{/auth/login}" method="post">
                    <div class="mb-4 form-control-validation">
                        <label for="email" class="form-label">Login</label>
                        <input type="text" class="form-control" id="email" name="username"
                               placeholder="Entrez votre login" autofocus required/>
                    </div>

                    <div class="mb-4 form-password-toggle form-control-validation">
                        <label for="password" class="form-label">Mot de passe</label>
                        <div class="input-group input-group-merge">
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="*****************" aria-describedby="password" required/>
                            <span class="input-group-text cursor-pointer">
                                <i class="icon-base bx bx-hide"></i>
                            </span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                    </div>

                    <button type="submit" class="btn btn-primary d-grid w-100 mt-4">Se connecter</button>
                </form>
            </div>
        </div>
        <!-- /Formulaire de connexion -->
    </div>
</div>

<!-- Inclure les scripts JS via fragment Thymeleaf -->
<div th:replace="~{fragments/js :: js}"></div>
<script th:inline="javascript">
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof window.AppToasts === 'undefined') return;
    // Message quand redirection suite à token absent/invalide (session expirée)
    var params = new URLSearchParams(window.location.search);
    if (params.get('session') === 'expired') {
      window.AppToasts.error('Session expirée ou token invalide. Veuillez vous reconnecter.');
      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }
    // Messages flash (erreur login, déconnexion réussie, etc.)
    var errorEl = document.querySelector('[data-flash-toast="error"]');
    var successEl = document.querySelector('[data-flash-toast="success"]');
    if (errorEl && errorEl.getAttribute('data-message')) {
      window.AppToasts.error(errorEl.getAttribute('data-message'));
    }
    if (successEl && successEl.getAttribute('data-message')) {
      window.AppToasts.success(successEl.getAttribute('data-message'));
    }
  });
</script>

</body>
</html>

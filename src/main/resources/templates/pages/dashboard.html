<!doctype html>
<html lang="fr" class="layout-navbar-fixed layout-menu-fixed layout-compact" data-bs-theme="light">

<head th:replace="~{fragments/head :: head}"></head>

<body>

<div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">

        <!-- Aside -->
        <div th:replace="~{fragments/aside :: aside}"></div>

        <!-- Layout page -->
        <div class="layout-page">

            <!-- Navbar -->
            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <!-- Content -->
            <div class="content-wrapper">
                <div class="container-xxl flex-grow-1 container-p-y">
                    <!-- Messages flash (connexion réussie, etc.) affichés en toast -->
                    <div th:if="${success}" class="d-none" data-flash-toast="success" th:data-message="${success}"></div>
                    <div th:if="${error}" class="d-none" data-flash-toast="error" th:data-message="${error}"></div>
                    <div class="row">
                        <!-- Contenu dashboard ici -->
                    </div>
                </div>

                <!-- Footer -->
                <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
            <!-- /Content -->

        </div>
        <!-- /Layout page -->

    </div>
</div>

<!-- Scripts -->
<div th:replace="~{fragments/js :: js}"></div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var successEl = document.querySelector('[data-flash-toast="success"]');
    var errorEl = document.querySelector('[data-flash-toast="error"]');
    if (window.AppToasts) {
      if (successEl && successEl.getAttribute('data-message')) {
        window.AppToasts.success(successEl.getAttribute('data-message'));
      }
      if (errorEl && errorEl.getAttribute('data-message')) {
        window.AppToasts.error(errorEl.getAttribute('data-message'));
      }
    }
  });
</script>

</body>
</html>

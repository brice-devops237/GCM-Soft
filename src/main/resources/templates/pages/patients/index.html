<!DOCTYPE html>
<html lang="fr" class="layout-navbar-fixed layout-menu-fixed layout-compact" data-bs-theme="light"
  data-template="default" data-assets-path="/assets/">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">
      <!-- Aside -->
      <div th:replace="~{fragments/aside :: aside}"></div>

      <!-- Layout page -->
      <div class="layout-page">
        <!-- Navbar -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Content -->
        <div class="content-wrapper">
          <div class="container-xxl flex-grow-1 container-p-y">

            <!-- Messages Flash : masqués, affichés uniquement en toast par showFlashAsToasts() -->
            <div th:if="${success}" class="alert alert-success d-none flash-message" role="alert" data-flash="success">
              <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="alert alert-danger d-none flash-message" role="alert" data-flash="error">
              <span th:text="${error}"></span>
            </div>

            <!-- Module Gestion des patients (masqué quand la section Paramètres est affichée) -->
            <div class="card" id="patientsModuleCard">
              <div class="card-body">
                <div class="d-flex align-items-center justify-content-between mb-4">
                  <!-- Bouton Ajouter -->
                  <div>
                    <button type="button" class="btn btn-primary btn-sm px-3" data-bs-toggle="modal"
                      data-bs-target="#modalPatient">
                      <span class="bx bx-plus-circle me-1"></span> Ajouter patient
                    </button>
                  </div>

                  <!-- Filtres -->
                  <div class="d-flex align-items-center gap-2">
                    <div class="input-group input-group-sm">
                      <input type="date" class="form-control" id="filterDateDebut" />
                      <span class="input-group-text px-2">au</span>
                      <input type="date" class="form-control" id="filterDateFin" />
                    </div>
                    <input type="text" class="form-control form-control-sm" id="filterCode"
                      placeholder="Code patient" />
                    <input type="text" class="form-control form-control-sm" id="filterSearch"
                      placeholder="Nom et prénom..." />
                    <select class="form-select form-select-sm" id="filterSexe" style="width: auto;">
                      <option value="">Tous</option>
                      <option value="Masculin">Masculin</option>
                      <option value="Féminin">Féminin</option>
                    </select>
                    <div class="spinner-border spinner-border-sm d-none" id="filterSpinner" role="status"
                      style="width: 1rem; height: 1rem;">
                      <span class="visually-hidden">Chargement...</span>
                    </div>
                  </div>
                </div>

                <!-- Table des patients -->
                <div th:replace="~{fragments/patients/content/patients-table :: patientsTable}"></div>
              </div>
            </div>

            <!-- Card Paramètres du patient sélectionné -->
            <div class="card mt-4" id="parametresCard" style="display: none;">
              <div class="card-body">
                <div class="d-flex align-items-center justify-content-between mb-3">
                  <h6 class="mb-0">Paramètres du patient : <span id="selectedPatientName"></span></h6>
                  <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-outline-danger btn-sm" id="btnCloseParametresCard"
                      title="Fermer la section">
                      Fermer
                    </button>
                    <button type="button" class="btn btn-primary btn-sm" id="btnAddParametres">
                      Ajouter
                    </button>
                  </div>
                </div>
                <div class="table-responsive">
                  <table class="table table-sm table-hover align-middle" id="parametresTable"
                    style="font-size: 0.8rem;">
                    <thead class="table-dark" style="font-size: 0.75rem;">
                      <tr>
                        <th style="font-size: 0.75rem;" class="text-white fw-bold">Date</th>
                        <th style="font-size: 0.75rem;" class="text-white fw-bold">Heure</th>
                        <th style="font-size: 0.75rem;" class="text-white fw-bold">PAM</th>
                        <th style="font-size: 0.75rem;" class="text-white fw-bold">FC</th>
                        <th style="font-size: 0.75rem;" class="text-white fw-bold">FR</th>
                        <th style="font-size: 0.75rem;" class="text-white fw-bold">Temp</th>
                        <th style="font-size: 0.75rem;" class="text-white fw-bold">SaO2</th>
                        <th style="font-size: 0.75rem;" class="text-white fw-bold">PAS</th>
                        <th style="font-size: 0.75rem;" class="text-white fw-bold">PAD</th>
                        <th style="font-size: 0.75rem;" class="text-white fw-bold">Poids</th>
                        <th style="font-size: 0.75rem;" class="text-white fw-bold">Taille</th>
                        <th style="font-size: 0.75rem;" class="text-white fw-bold">IMC</th>
                        <th style="font-size: 0.75rem;" class="text-white fw-bold">Source</th>
                        <th style="font-size: 0.75rem;" class="text-center text-white fw-bold">Actions</th>
                      </tr>
                    </thead>
                    <tbody id="parametresTableBody">
                      <tr>
                        <td colspan="14" class="text-center text-muted py-4">
                          <i class="bx bx-info-circle fs-4 d-block mb-2"></i>
                          Aucun paramètre enregistré pour ce patient
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- Footer -->
        <div th:replace="~{fragments/footer :: footer}"></div>
      </div>
    </div>
  </div>

  <!-- Modal Patient -->
  <div th:replace="~{fragments/patients/modals/modal-patient}"></div>

  <!-- Modal Paramètres Patient -->
  <div th:replace="~{fragments/patients/modals/modal-parametres}"></div>

  <!-- Modal de Confirmation -->
  <div class="modal fade" id="modalConfirm" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 420px;">
      <div class="modal-content">
        <div class="modal-header" id="confirmModalHeader">
          <h5 class="modal-title" id="confirmModalTitle">Confirmation</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="confirmModalMessage">Êtes-vous sûr de vouloir effectuer cette action ?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-label-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-danger" id="confirmModalBtn">Confirmer</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <div th:replace="~{fragments/js :: js}"></div>

  <script>
    // Variables globales
    let currentStep = 1;
    const totalSteps = 3;
    let currentPatientCode = null;
    let currentPatientName = null;
    let isParametreEditMode = false;

    // Vérification 401 : redirection vers login et toast si session expirée
    function checkAuthResponse(response) {
      if (response.status === 401) {
        if (window.AppToasts) window.AppToasts.error('Session expirée. Veuillez vous reconnecter.');
        window.location.href = '/login';
        throw new Error('Unauthorized');
      }
      return response;
    }

    // Afficher les messages flash (success/error) en toasts et masquer les alertes inline
    function showFlashAsToasts() {
      if (typeof window.AppToasts === 'undefined') return;
      var successEl = document.querySelector('.alert-success');
      if (successEl) {
        var text = (successEl.querySelector('span') || successEl).textContent.trim();
        if (text) {
          window.AppToasts.success(text);
          successEl.remove();
        }
      }
      var errorEl = document.querySelector('.alert-danger');
      if (errorEl) {
        var errText = (errorEl.querySelector('span') || errorEl).textContent.trim();
        if (errText) {
          window.AppToasts.error(errText);
          errorEl.remove();
        }
      }
    }

    // Initialisation
    document.addEventListener('DOMContentLoaded', function () {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date')?.setAttribute('value', today);
      document.getElementById('paramDate')?.setAttribute('value', today);

      // Select2 pour le champ Nationalité (modal patient)
      var nationaliteSelect = document.getElementById('nationalite');
      if (nationaliteSelect && typeof $ !== 'undefined' && $.fn.select2) {
        var $sel = $(nationaliteSelect);
        if (!$sel.hasClass('select2-hidden-accessible')) {
          $sel.wrap('<div class="position-relative"></div>').select2({
            placeholder: 'Sélectionner une nationalité',
            allowClear: true,
            dropdownParent: $('#modalPatient'),
            width: '100%'
          });
        }
      }

      setupCalculations();
      setupPatientForm();
      setupParametresForm();
      setupTableActions();
      setupRealTimeFilters();

      // Parser et afficher les erreurs backend sous les champs
      parseBackendErrors();
      // Afficher les messages flash en toasts (success/error) et retirer les alertes inline
      showFlashAsToasts();
    });

    // Configuration des actions de la table avec délégation d'événements
    function setupTableActions() {
      // Utiliser la délégation d'événements pour gérer les boutons même s'ils sont ajoutés dynamiquement
      const patientsTable = document.querySelector('.table');

      if (patientsTable) {
        // Bouton éditer patient
        patientsTable.addEventListener('click', function (e) {
          if (e.target.closest('.btn-edit-patient')) {
            const btn = e.target.closest('.btn-edit-patient');
            const patientId = btn.getAttribute('data-patient-id');
            editPatient(parseInt(patientId));
          }

          // Bouton afficher paramètres
          if (e.target.closest('.btn-show-parametres')) {
            const btn = e.target.closest('.btn-show-parametres');
            const code = btn.getAttribute('data-patient-code');
            const name = btn.getAttribute('data-patient-name');
            showParametresCard(code, name);
          }

          // Bouton supprimer patient
          if (e.target.closest('.btn-delete-patient')) {
            const btn = e.target.closest('.btn-delete-patient');
            const patientId = parseInt(btn.getAttribute('data-patient-id'));
            const patientName = btn.getAttribute('data-patient-name');
            confirmDeletePatient(patientId, patientName);
          }
        });
      }

      // Délégation pour les paramètres (table générée dynamiquement)
      const parametresCard = document.getElementById('parametresCard');
      if (parametresCard) {
        parametresCard.addEventListener('click', function (e) {
          if (e.target.closest('.btn-edit-parametre')) {
            const btn = e.target.closest('.btn-edit-parametre');
            const parametreId = parseInt(btn.getAttribute('data-parametre-id'));
            editParametre(parametreId);
          }
          if (e.target.closest('.btn-delete-parametre')) {
            const btn = e.target.closest('.btn-delete-parametre');
            const parametreId = parseInt(btn.getAttribute('data-parametre-id'));
            deleteParametre(parametreId);
          }
        });
      }
    }

    // Parser les erreurs backend et les afficher sous les champs
    function parseBackendErrors() {
      const errorAlert = document.querySelector('.alert-danger');
      if (!errorAlert) return;

      const errorText = errorAlert.textContent.trim();
      if (!errorText) return;

      // Mapping des messages d'erreur aux champs
      const errorMapping = {
        'Nom du patient obligatoire': 'noms',
        'Sexe du patient obligatoire': 'sexe',
        'Date de naissance obligatoire': 'dateNaissance',
        'Téléphone du patient obligatoire': 'phone',
        'Nom du consulteur obligatoire': 'consulteur',
        'Champ printBy obligatoire': 'printBy',
        'Date d\'enregistrement obligatoire': 'date',
        'Le code patient doit être renseigné': 'codePatient',
        'La source des paramètres': 'source'
      };

      // Chercher le champ correspondant
      for (const [message, fieldName] of Object.entries(errorMapping)) {
        if (errorText.includes(message)) {
          const field = document.getElementById(fieldName) || document.querySelector(`[name="${fieldName}"]`);
          if (field) {
            field.classList.add('is-invalid');
            const errorDiv = document.getElementById(`error-${fieldName}`);
            if (errorDiv) {
              errorDiv.textContent = errorText;
            } else {
              // Créer l'élément d'erreur s'il n'existe pas
              const errorElement = document.createElement('div');
              errorElement.className = 'invalid-feedback';
              errorElement.id = `error-${fieldName}`;
              errorElement.textContent = errorText;
              field.parentNode.appendChild(errorElement);
            }

            // Ouvrir le modal si fermé
            const modal = document.getElementById('modalPatient');
            if (modal && !modal.classList.contains('show')) {
              const bsModal = new bootstrap.Modal(modal);
              bsModal.show();
            }

            // Aller à l'étape appropriée
            if (fieldName === 'noms' || fieldName === 'sexe' || fieldName === 'dateNaissance' || fieldName === 'phone') {
              currentStep = 1;
              resetStepper();
            } else if (fieldName === 'date' || fieldName === 'consulteur' || fieldName === 'printBy') {
              currentStep = 3;
              resetStepper();
            }

            // Scroll vers le champ
            field.scrollIntoView({ behavior: 'smooth', block: 'center' });
            break;
          }
        }
      }
    }

    // Stepper functions
    function nextStep() {
      if (validateStep(currentStep)) {
        if (currentStep < totalSteps) {
          document.querySelector(`.stepper-content[data-step="${currentStep}"]`).classList.add('d-none');
          document.querySelector(`.stepper-item:nth-child(${currentStep})`).classList.remove('active');
          document.querySelector(`.stepper-item:nth-child(${currentStep})`).classList.add('completed');

          currentStep++;
          document.querySelector(`.stepper-content[data-step="${currentStep}"]`).classList.remove('d-none');
          document.querySelector(`.stepper-item:nth-child(${currentStep})`).classList.add('active');

          updateStepperButtons();
        }
      }
    }

    function prevStep() {
      if (currentStep > 1) {
        document.querySelector(`.stepper-content[data-step="${currentStep}"]`).classList.add('d-none');
        document.querySelector(`.stepper-item:nth-child(${currentStep})`).classList.remove('active');

        currentStep--;
        document.querySelector(`.stepper-content[data-step="${currentStep}"]`).classList.remove('d-none');
        document.querySelector(`.stepper-item:nth-child(${currentStep})`).classList.add('active');
        document.querySelector(`.stepper-item:nth-child(${currentStep})`).classList.remove('completed');

        updateStepperButtons();
      }
    }

    function updateStepperButtons() {
      const btnPrev = document.getElementById('btnPrevStep');
      const btnNext = document.getElementById('btnNextStep');
      const btnSubmit = document.getElementById('btnSubmit');
      const hasStepper = document.querySelector('.stepper-content') != null;
      if (hasStepper) {
        if (btnPrev) btnPrev.style.display = currentStep > 1 ? 'inline-block' : 'none';
        if (btnNext) btnNext.style.display = currentStep < totalSteps ? 'inline-block' : 'none';
        if (btnSubmit) btnSubmit.classList.toggle('d-none', currentStep < totalSteps);
      } else {
        if (btnSubmit) btnSubmit.classList.remove('d-none');
      }
    }

    function validateStep(step) {
      const stepContent = document.querySelector('.stepper-content[data-step="' + step + '"]');
      if (!stepContent) {
        var required = document.querySelectorAll('#patientForm [required]');
        var allValid = true;
        for (var i = 0; i < required.length; i++) {
          if (!required[i].value.trim()) {
            required[i].classList.add('is-invalid');
            allValid = false;
          } else {
            required[i].classList.remove('is-invalid');
          }
        }
        return allValid;
      }
      var isValid = true;
      var requiredFields = stepContent.querySelectorAll('[required]');

      requiredFields.forEach(field => {
        if (!field.value.trim()) {
          isValid = false;
          field.classList.add('is-invalid');
          const errorDiv = document.getElementById(`error-${field.name}`);
          if (errorDiv) {
            errorDiv.textContent = 'Ce champ est obligatoire';
          }
        } else {
          field.classList.remove('is-invalid');
          const errorDiv = document.getElementById(`error-${field.name}`);
          if (errorDiv) {
            errorDiv.textContent = '';
          }
        }
      });

      return isValid;
    }

    // Configuration des calculs automatiques
    function setupCalculations() {
      const pasInput = document.getElementById('pas');
      const padInput = document.getElementById('pad');
      const pamInput = document.getElementById('pam');

      if (pasInput && padInput && pamInput) {
        function calculatePAM() {
          const pas = parseFloat(pasInput.value) || 0;
          const pad = parseFloat(padInput.value) || 0;
          if (pas > 0 && pad > 0) {
            const pam = pad + (pas - pad) / 3;
            pamInput.value = pam.toFixed(1);
          } else {
            pamInput.value = '';
          }
        }
        pasInput.addEventListener('input', calculatePAM);
        padInput.addEventListener('input', calculatePAM);
      }

      const poidsInput = document.getElementById('poids');
      const tailleInput = document.getElementById('taille');
      const imcInput = document.getElementById('imc');

      if (poidsInput && tailleInput && imcInput) {
        function calculateIMC() {
          const poids = parseFloat(poidsInput.value) || 0;
          const taille = parseFloat(tailleInput.value) || 0;
          if (poids > 0 && taille > 0) {
            const tailleEnMetres = taille / 100;
            const imc = poids / (tailleEnMetres * tailleEnMetres);
            imcInput.value = imc.toFixed(2);
          } else {
            imcInput.value = '';
          }
        }
        poidsInput.addEventListener('input', calculateIMC);
        tailleInput.addEventListener('input', calculateIMC);
      }

      const btnCalculerTerme = document.getElementById('btnCalculerTerme');
      const ddrInput = document.getElementById('ddr');
      const termePrevuDisplay = document.getElementById('termePrevuDisplay');
      if (btnCalculerTerme && ddrInput && termePrevuDisplay) {
        btnCalculerTerme.addEventListener('click', function () {
          if (!ddrInput.value) {
            termePrevuDisplay.textContent = 'Saisir la DDR puis cliquer sur Calculer.';
            return;
          }
          const d = new Date(ddrInput.value + 'T12:00:00');
          d.setDate(d.getDate() + 281);
          termePrevuDisplay.textContent = 'Terme prévu : ' + d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        });
      }
    }

    // Active/désactive le bouton Enregistrer selon les champs requis
    function updatePatientSubmitButton() {
      var btn = document.getElementById('btnSubmit');
      var form = document.getElementById('patientForm');
      if (!btn || !form) return;
      var required = form.querySelectorAll('[required]');
      var allOk = true;
      for (var i = 0; i < required.length; i++) {
        if (!required[i].value || !required[i].value.trim()) {
          allOk = false;
          break;
        }
      }
      btn.disabled = !allOk;
    }

    // Configuration du formulaire patient
    function setupPatientForm() {
      const modalPatient = document.getElementById('modalPatient');
      const patientForm = document.getElementById('patientForm');
      const btnAddPatient = document.querySelector('[data-bs-target="#modalPatient"]');

      if (btnAddPatient) {
        btnAddPatient.addEventListener('click', function () {
          if (patientForm) patientForm.reset();
          var pid = document.getElementById('patientId');
          if (pid) pid.value = '';
          patientForm.setAttribute('action', '/patients/create');
          var titleEl = document.getElementById('modalPatientTitle');
          if (titleEl) titleEl.innerHTML = 'Enregistrement d\'un patient';
          currentStep = 1;
          resetStepper();
          var dateEl = document.getElementById('date');
          if (dateEl) dateEl.value = new Date().toISOString().split('T')[0];
          var d1 = document.getElementById('contactNomDisplay');
          var d2 = document.getElementById('contactRelationDisplay');
          var d3 = document.getElementById('contactTelDisplay');
          if (d1) d1.textContent = '\u2014';
          if (d2) d2.textContent = '\u2014';
          if (d3) d3.textContent = '\u2014';
          var wrap = document.getElementById('relationUrgenceAutreWrap');
          var autreInput = document.getElementById('relationUrgenceAutre');
          if (wrap) wrap.classList.add('d-none');
          if (autreInput) autreInput.value = '';
          clearErrors();
          updatePatientSubmitButton();
          var lbl = document.getElementById('btnSubmitLabel');
          if (lbl) lbl.textContent = 'Enregistrer';
          if (typeof syncRelationUrgenceHidden === 'function') syncRelationUrgenceHidden();
        });
      }

      if (patientForm) {
        patientForm.addEventListener('input', updatePatientSubmitButton);
        patientForm.addEventListener('change', updatePatientSubmitButton);
        setupRelationUrgenceAutre();
        patientForm.addEventListener('submit', function (e) {
          e.preventDefault();
          if (!validateStep(currentStep)) {
            return;
          }

          const formAction = patientForm.getAttribute('action');
          const isEdit = formAction.includes('/edit/');
          const patientName = document.getElementById('noms').value || 'ce patient';

          showConfirmModal(
            isEdit ? 'Modifier le patient' : 'Créer un nouveau patient',
            isEdit
              ? `Êtes-vous sûr de vouloir modifier les informations de <strong>${patientName}</strong> ?`
              : `Êtes-vous sûr de vouloir créer un nouveau patient avec le nom <strong>${patientName}</strong> ?`,
            function () {
              if (typeof syncRelationUrgenceHidden === 'function') syncRelationUrgenceHidden();
              patientForm.submit();
            }
          );
        });
      }

      if (modalPatient) {
        modalPatient.addEventListener('hidden.bs.modal', function () {
          patientForm.reset();
          document.getElementById('patientId').value = '';
          patientForm.setAttribute('action', '/patients/create');
          currentStep = 1;
          resetStepper();
          clearErrors();
          updatePatientSubmitButton();
          var lbl = document.getElementById('btnSubmitLabel');
          if (lbl) lbl.textContent = 'Enregistrer';
          var wrap = document.getElementById('relationUrgenceAutreWrap');
          var autreInput = document.getElementById('relationUrgenceAutre');
          if (wrap) wrap.classList.add('d-none');
          if (autreInput) autreInput.value = '';
        });
      }
    }

    function syncRelationUrgenceHidden() {
      var relationSelect = document.getElementById('relationUrgence');
      var hidden = document.getElementById('relationUrgenceHidden');
      var autreInput = document.getElementById('relationUrgenceAutre');
      if (!relationSelect || !hidden) return;
      var v = relationSelect.value === 'Autre' && autreInput ? autreInput.value.trim() : relationSelect.value;
      hidden.value = v || '';
    }

    function setupRelationUrgenceAutre() {
      var relationSelect = document.getElementById('relationUrgence');
      var wrap = document.getElementById('relationUrgenceAutreWrap');
      var autreInput = document.getElementById('relationUrgenceAutre');
      var displayRelation = document.getElementById('contactRelationDisplay');
      if (!relationSelect || !wrap || !autreInput) return;
      function updateRelationDisplay() {
        if (!displayRelation) return;
        if (relationSelect.value === 'Autre') {
          var v = autreInput.value.trim();
          displayRelation.textContent = v || '\u2014';
        } else {
          displayRelation.textContent = relationSelect.value ? relationSelect.options[relationSelect.selectedIndex].text : '\u2014';
        }
        syncRelationUrgenceHidden();
      }
      relationSelect.addEventListener('change', function () {
        if (relationSelect.value === 'Autre') {
          wrap.classList.remove('d-none');
          autreInput.focus();
        } else {
          wrap.classList.add('d-none');
          autreInput.value = '';
        }
        updateRelationDisplay();
      });
      autreInput.addEventListener('input', updateRelationDisplay);
      autreInput.addEventListener('change', updateRelationDisplay);
    }

    function resetStepper() {
      document.querySelectorAll('.stepper-content').forEach((el, idx) => {
        el.classList.toggle('d-none', idx !== 0);
      });
      document.querySelectorAll('.stepper-item').forEach((el, idx) => {
        el.classList.remove('active', 'completed');
        if (idx === 0) el.classList.add('active', 'completed');
      });
      updateStepperButtons();
    }

    function clearErrors() {
      document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
      document.querySelectorAll('.invalid-feedback').forEach(el => el.textContent = '');
    }

    // Fermer la section paramètres et réafficher le module liste des patients
    function closeParametresCard() {
      const parametresCard = document.getElementById('parametresCard');
      const patientsModuleCard = document.getElementById('patientsModuleCard');
      if (parametresCard) parametresCard.style.display = 'none';
      if (patientsModuleCard) patientsModuleCard.style.display = 'block';
    }

    // Configuration du formulaire paramètres
    function setupParametresForm() {
      const modalParametres = document.getElementById('modalParametres');
      const parametresForm = document.getElementById('parametresForm');
      const btnAddParametres = document.getElementById('btnAddParametres');
      const btnCloseParametresCard = document.getElementById('btnCloseParametresCard');

      if (btnAddParametres) {
        btnAddParametres.addEventListener('click', function () {
          if (!currentPatientCode) {
            window.AppToasts && window.AppToasts.warning('Veuillez d\'abord sélectionner un patient.');
            return;
          }
          openParametresModal();
        });
      }

      if (btnCloseParametresCard) {
        btnCloseParametresCard.addEventListener('click', closeParametresCard);
      }

      if (parametresForm) {
        parametresForm.addEventListener('submit', function (e) {
          e.preventDefault();
          const patientName = currentPatientName || 'le patient';
          const sourceEl = document.getElementById('source');
          const source = (sourceEl && sourceEl.value) ? sourceEl.value : 'non spécifiée';
          const isEdit = isParametreEditMode;

          const confirmTitle = isEdit ? 'Modifier les paramètres' : 'Enregistrer les paramètres';
          const confirmMessage = isEdit
            ? `Êtes-vous sûr de vouloir <strong>modifier</strong> ces paramètres cliniques pour <strong>${patientName}</strong> ?<br><small class="text-muted">Source : ${source}</small>`
            : `Êtes-vous sûr de vouloir enregistrer les paramètres cliniques pour <strong>${patientName}</strong> ?<br><small class="text-muted">Source : ${source}</small>`;

          showConfirmModal(confirmTitle, confirmMessage, function () {
            const form = document.getElementById('parametresForm');
            if (!form) return;
            if (isEdit) {
              const formData = new FormData(form);
              fetch('/parametres-patient/update', { method: 'POST', body: formData, credentials: 'same-origin' })
                .then(checkAuthResponse)
                .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
                .then(function (res) {
                  if (res.data && res.data.success) {
                    window.AppToasts && window.AppToasts.success(res.data.message || 'Les paramètres ont été modifiés avec succès.');
                    bootstrap.Modal.getInstance(document.getElementById('modalParametres')).hide();
                    if (currentPatientCode) loadParametres(currentPatientCode);
                  } else {
                    window.AppToasts && window.AppToasts.error(res.data && res.data.message ? res.data.message : 'Erreur lors de la modification.');
                  }
                })
                .catch(function () {
                  window.AppToasts && window.AppToasts.error('Erreur lors de la modification des paramètres.');
                });
            } else {
              setTimeout(function () { form.submit(); }, 150);
            }
          });
        });
      }

      if (modalParametres) {
        modalParametres.addEventListener('hidden.bs.modal', function () {
          parametresForm.reset();
          document.getElementById('parametreId').value = '';
          const today = new Date().toISOString().split('T')[0];
          const paramDateEl = document.getElementById('paramDate');
          if (paramDateEl) paramDateEl.value = today;
          const termeDisplay = document.getElementById('termePrevuDisplay');
          if (termeDisplay) termeDisplay.textContent = '';
          clearErrors();
        });
      }
    }

    // Éditer un patient
    function editPatient(id) {
      fetch('/patients/api/' + id, { credentials: 'same-origin' })
        .then(checkAuthResponse)
        .then(response => response.json())
        .then(patient => {
          document.getElementById('patientId').value = patient.id;
          document.getElementById('noms').value = patient.noms || '';
          document.getElementById('sexe').value = patient.sexe || '';
          document.getElementById('dateNaissance').value = patient.dateNaissance || '';
          document.getElementById('lieuNaissance').value = patient.lieuNaissance || '';
          var nationaliteEl = document.getElementById('nationalite');
          if (nationaliteEl) {
            nationaliteEl.value = patient.nationalite || '';
            if ($(nationaliteEl).data('select2')) $(nationaliteEl).trigger('change');
          }
          document.getElementById('groupe').value = patient.groupe || '';
          document.getElementById('adresse').value = patient.adresse || '';
          document.getElementById('ville').value = patient.ville || '';
          document.getElementById('phone').value = patient.phone || '';
          document.getElementById('cni').value = patient.cni || '';
          document.getElementById('profession').value = patient.profession || '';
          document.getElementById('etatMatrimonial').value = patient.etatMatrimonial || '';
          document.getElementById('nomMere').value = patient.nomMere || '';
          document.getElementById('nomPere').value = patient.nomPere || '';
          document.getElementById('ethnie').value = patient.ethnie || '';
          document.getElementById('religion').value = patient.religion || '';
          document.getElementById('typePatient').value = patient.typePatient || 'Normal';
          document.getElementById('urgence').value = patient.urgence || '';
          document.getElementById('contactUrgence').value = patient.contactUrgence || '';
          var relationVal = patient.relationUrgence || '';
          var relationSelect = document.getElementById('relationUrgence');
          var relationWrap = document.getElementById('relationUrgenceAutreWrap');
          var relationAutre = document.getElementById('relationUrgenceAutre');
          var relationHidden = document.getElementById('relationUrgenceHidden');
          var opts = relationSelect ? Array.from(relationSelect.options).map(function (o) { return o.value; }) : [];
          if (relationVal && opts.indexOf(relationVal) >= 0) {
            relationSelect.value = relationVal;
            if (relationWrap) relationWrap.classList.add('d-none');
            if (relationAutre) relationAutre.value = '';
          } else {
            relationSelect.value = 'Autre';
            if (relationWrap) relationWrap.classList.remove('d-none');
            if (relationAutre) relationAutre.value = relationVal;
          }
          if (relationHidden) relationHidden.value = relationVal;
          document.getElementById('date').value = patient.date ? (typeof patient.date === 'string' ? patient.date.split('T')[0] : patient.date) : '';
          document.getElementById('consulteur').value = patient.consulteur || '';
          document.getElementById('printBy').value = patient.printBy || '';
          document.getElementById('commentaire').value = patient.commentaire || '';

          const d1 = document.getElementById('contactNomDisplay');
          const d2 = document.getElementById('contactRelationDisplay');
          const d3 = document.getElementById('contactTelDisplay');
          if (d1) d1.textContent = patient.urgence || '—';
          if (d2) d2.textContent = relationVal || '—';
          if (d3) d3.textContent = patient.contactUrgence || '—';

          const form = document.getElementById('patientForm');
          form.setAttribute('action', '/patients/edit/' + patient.id);
          document.getElementById('modalPatientTitle').innerHTML = 'Modifier un patient';
          var lbl = document.getElementById('btnSubmitLabel');
          if (lbl) lbl.textContent = 'Modifier';
          updatePatientSubmitButton();

          const modal = new bootstrap.Modal(document.getElementById('modalPatient'));
          modal.show();
        })
        .catch(error => {
          console.error('Error:', error);
          window.AppToasts && window.AppToasts.error('Impossible de charger les données du patient.');
        });
    }

    // Affiche la section paramètres et masque le module liste des patients
    function showParametresCard(code, name) {
      currentPatientCode = code;
      currentPatientName = name;

      document.getElementById('codePatientParam').value = code;
      document.getElementById('parametresPatientCode').textContent = code;
      document.getElementById('parametresPatientName').textContent = name;

      document.getElementById('selectedPatientName').textContent = name + ' (' + code + ')';

      document.getElementById('patientsModuleCard').style.display = 'none';
      document.getElementById('parametresCard').style.display = 'block';

      loadParametres(code);
    }

    // Ouvre le modal paramètres (à appeler depuis la card uniquement) — mode création
    function openParametresModal() {
      isParametreEditMode = false;
      const codePatientParam = document.getElementById('codePatientParam');
      const paramDateEl = document.getElementById('paramDate');
      const sourceEl = document.getElementById('source');
      const parametreIdEl = document.getElementById('parametreId');
      if (parametreIdEl) parametreIdEl.value = '';
      if (currentPatientCode && codePatientParam) codePatientParam.value = currentPatientCode;
      const today = new Date().toISOString().split('T')[0];
      if (paramDateEl) paramDateEl.value = today;
      if (sourceEl) sourceEl.value = sourceEl.value || 'Consultation';
      const modalEl = document.getElementById('modalParametres');
      if (modalEl) {
        const modal = new bootstrap.Modal(modalEl);
        modal.show();
      }
    }

    // Charge un paramètre par id et ouvre le modal en mode édition
    function editParametre(id) {
      fetch('/parametres-patient/get/' + id, { credentials: 'same-origin' })
        .then(checkAuthResponse)
        .then(response => response.json())
        .then(function (p) {
          isParametreEditMode = true;
          const setVal = function (id, v) { var el = document.getElementById(id); if (el) el.value = (v != null && v !== '') ? v : ''; };
          setVal('parametreId', p.id);
          setVal('codePatientParam', p.codePatient);
          setVal('codeTraitement', p.codeTraitement || '');
          setVal('paramDate', p.date || '');
          setVal('paramHeure', p.heure || '');
          setVal('source', p.source || 'Consultation');
          setVal('pam', p.ta);
          setVal('fc', p.fc);
          setVal('fr', p.fr);
          setVal('temp', p.temp);
          setVal('sa02', p.sa02);
          setVal('pas', p.pas);
          setVal('pad', p.pad);
          setVal('poids', p.poids);
          setVal('taille', p.taille);
          setVal('imc', p.imc);
          setVal('duirese', p.duirese);
          setVal('ddr', p.ddr || '');
          setVal('autre', p.autre || '');
          if (currentPatientCode) document.getElementById('codePatientParam').value = currentPatientCode;
          var modalEl = document.getElementById('modalParametres');
          if (modalEl) {
            var modal = new bootstrap.Modal(modalEl);
            modal.show();
          }
        })
        .catch(function (err) {
          console.error('Error loading parametre:', err);
          window.AppToasts && window.AppToasts.error('Impossible de charger les paramètres pour modification.');
        });
    }

    function loadParametres(codePatient) {
      fetch('/parametres-patient/by-code?codePatient=' + encodeURIComponent(codePatient), { credentials: 'same-origin' })
        .then(checkAuthResponse)
        .then(response => response.json())
        .then(data => {
          const tbody = document.getElementById('parametresTableBody');
          if (!tbody) return;
          if (data && data.length > 0) {
            const escapeHtml = (t) => { if (t == null) return ''; const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
            tbody.innerHTML = data.map(param => {
              const date = formatDate(param.date);
              const heure = escapeHtml(param.heure || '-');
              const ta = param.ta != null ? param.ta : '-';
              const fc = param.fc != null ? param.fc : '-';
              const fr = param.fr != null ? param.fr : '-';
              const temp = escapeHtml(param.temp || '-');
              const sa02 = escapeHtml(param.sa02 || '-');
              const pas = param.pas != null ? param.pas : '-';
              const pad = param.pad != null ? param.pad : '-';
              const poids = escapeHtml(param.poids || '-');
              const taille = escapeHtml(param.taille || '-');
              const imc = escapeHtml(param.imc || '-');
              const source = escapeHtml(param.source || '-');
              const id = param.id;
              return `
              <tr data-parametre-id="${id}">
                <td>${date}</td>
                <td>${heure}</td>
                <td>${ta}</td>
                <td>${fc}</td>
                <td>${fr}</td>
                <td>${temp}</td>
                <td>${sa02}</td>
                <td>${pas}</td>
                <td>${pad}</td>
                <td>${poids}</td>
                <td>${taille}</td>
                <td>${imc}</td>
                <td><span>${source}</span></td>
                <td class="text-center">
                  <div class="dropdown">
                    <button type="button" class="btn btn-sm btn-icon btn-text-secondary rounded-pill dropdown-toggle hide-arrow"
                      data-bs-toggle="dropdown" aria-expanded="false" title="Actions">
                      <i class="bx bx-dots-vertical-rounded"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                      <li>
                        <button type="button" class="dropdown-item btn-edit-parametre d-flex align-items-center"
                          data-parametre-id="${id}">
                          <i class="bx bx-edit me-2"></i> Modifier
                        </button>
                      </li>
                      <li>
                        <button type="button" class="dropdown-item btn-delete-parametre d-flex align-items-center text-danger"
                          data-parametre-id="${id}">
                          <i class="bx bx-trash me-2"></i> Supprimer
                        </button>
                      </li>
                    </ul>
                  </div>
                </td>
              </tr>
            `;
            }).join('');
          } else {
            tbody.innerHTML = `
              <tr>
                <td colspan="14" class="text-center text-muted py-4">
                  <i class="bx bx-info-circle fs-4 d-block mb-2"></i>
                  Aucun paramètre enregistré pour ce patient
                </td>
              </tr>
            `;
          }
        })
        .catch(error => {
          console.error('Error loading parametres:', error);
          const tbody = document.getElementById('parametresTableBody');
          if (tbody) tbody.innerHTML = '<tr><td colspan="14" class="text-center text-danger py-4">Erreur lors du chargement des paramètres</td></tr>';
        });
    }

    function deleteParametre(id) {
      showConfirmModal(
        'Supprimer les paramètres',
        'Êtes-vous sûr de vouloir supprimer ces paramètres cliniques ?<br><small class="text-danger">Cette action est irréversible.</small>',
        function () {
          fetch('/parametres-patient/delete/' + id, { method: 'GET', credentials: 'same-origin' })
            .then(checkAuthResponse)
            .then(response => {
              if (response.ok || response.redirected) {
                if (currentPatientCode) {
                  setTimeout(function () {
                    loadParametres(currentPatientCode);
                  }, 300);
                } else {
                  window.location.reload();
                }
              } else {
                window.AppToasts && window.AppToasts.error('La suppression des paramètres a échoué.');
              }
            })
            .catch(error => {
              console.error('Error:', error);
              window.AppToasts && window.AppToasts.error('La suppression des paramètres a échoué.');
            });
        }
      );
    }

    function confirmDeletePatient(id, name) {
      showConfirmModal(
        'Supprimer le patient',
        `Êtes-vous sûr de vouloir supprimer le patient <strong>${name}</strong> ?<br><small class="text-danger">Cette action est irréversible et supprimera également tous ses paramètres.</small>`,
        function () {
          window.location.href = '/patients/delete/' + id;
        }
      );
    }

    function showConfirmModal(title, message, onConfirm) {
      const modal = document.getElementById('modalConfirm');
      document.getElementById('confirmModalTitle').textContent = title;
      document.getElementById('confirmModalMessage').innerHTML = message;

      const newBtn = document.getElementById('confirmModalBtn').cloneNode(true);
      document.getElementById('confirmModalBtn').parentNode.replaceChild(newBtn, document.getElementById('confirmModalBtn'));

      newBtn.addEventListener('click', function () {
        const bsModal = bootstrap.Modal.getInstance(modal);
        bsModal.hide();
        if (onConfirm) onConfirm();
      });

      const bsModal = new bootstrap.Modal(modal);
      bsModal.show();
    }

    // Configuration des filtres en temps réel
    let searchTimeout = null;
    let currentSearchRequest = null;

    function setupRealTimeFilters() {
      const filterCode = document.getElementById('filterCode');
      const filterSearch = document.getElementById('filterSearch');
      const filterSexe = document.getElementById('filterSexe');
      const filterDateDebut = document.getElementById('filterDateDebut');
      const filterDateFin = document.getElementById('filterDateFin');
      const filterSpinner = document.getElementById('filterSpinner');

      // Fonction de recherche avec debounce
      function performSearch() {
        // Annuler la requête précédente si elle existe
        if (currentSearchRequest) {
          currentSearchRequest.abort();
        }

        // Afficher le spinner
        filterSpinner.classList.remove('d-none');

        // Construire les paramètres de recherche
        const params = new URLSearchParams();
        const code = filterCode?.value.trim();
        const noms = filterSearch?.value.trim();
        const sexe = filterSexe?.value;
        const dateDebut = filterDateDebut?.value;
        const dateFin = filterDateFin?.value;

        if (code) params.append('code', code);
        if (noms) params.append('noms', noms);
        if (sexe) params.append('sexe', sexe);
        if (dateDebut) params.append('dateDebut', dateDebut);
        if (dateFin) params.append('dateFin', dateFin);

        // Effectuer la requête AJAX
        const controller = new AbortController();
        currentSearchRequest = controller;

        // Construire l'URL avec ou sans paramètres
        const url = params.toString()
          ? '/patients/api/search?' + params.toString()
          : '/patients/api/search';

        fetch(url, {
          method: 'GET',
          signal: controller.signal,
          credentials: 'same-origin',
          headers: { 'Accept': 'application/json' }
        })
          .then(checkAuthResponse)
          .then(response => {
            if (!response.ok) throw new Error('Erreur de recherche');
            return response.json();
          })
          .then(patients => {
            updatePatientsTable(patients);
            filterSpinner.classList.add('d-none');
            currentSearchRequest = null;
          })
          .catch(error => {
            if (error.name !== 'AbortError') {
              console.error('Erreur lors de la recherche:', error);
              if (window.AppToasts) window.AppToasts.error('Erreur lors de la recherche des patients.');
              filterSpinner.classList.add('d-none');
            }
            currentSearchRequest = null;
          });
      }

      // Debounce function - attendre 250ms après la dernière frappe pour réduire la latence
      function debouncedSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(performSearch, 250);
      }

      // Attacher les event listeners
      if (filterCode) {
        filterCode.addEventListener('input', debouncedSearch);
      }
      if (filterSearch) {
        filterSearch.addEventListener('input', debouncedSearch);
      }
      if (filterSexe) {
        filterSexe.addEventListener('change', performSearch);
      }
      if (filterDateDebut) {
        filterDateDebut.addEventListener('change', performSearch);
      }
      if (filterDateFin) {
        filterDateFin.addEventListener('change', performSearch);
      }
    }

    // Mettre à jour la table des patients (même structure que le fragment patients-table.html)
    function updatePatientsTable(patients) {
      const tbody = document.getElementById('patientsTableBody');

      if (!tbody) return;

      if (!patients || patients.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center text-muted py-4">
              <i class="bx bx-info-circle fs-4 d-block mb-2"></i>
              Aucun patient trouvé
            </td>
          </tr>
        `;
        return;
      }

      const escapeHtml = (text) => {
        if (text == null) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      };

      tbody.innerHTML = patients.map(patient => {
        const dateNaissance = patient.dateNaissance ? formatDate(patient.dateNaissance) : '-';
        const dateCreation = patient.dateCreation ? formatDate(patient.dateCreation) : '-';
        const code = escapeHtml(patient.code || '');
        const noms = escapeHtml(patient.noms || '');
        const sexe = escapeHtml(patient.sexe || '');
        const phone = escapeHtml(patient.phone || '');
        const typePatient = escapeHtml(patient.typePatient || '');
        const id = patient.id;
        const dataName = escapeHtml(patient.noms || '');

        return `
          <tr data-patient-id="${id}">
            <td><span>${code}</span></td>
            <td>${noms}</td>
            <td><span>${sexe}</span></td>
            <td>${dateNaissance}</td>
            <td>${phone}</td>
            <td><span>${typePatient}</span></td>
            <td>${dateCreation}</td>
            <td class="text-center">
              <div class="dropdown">
                <button type="button" class="btn btn-sm btn-icon btn-text-secondary rounded-pill dropdown-toggle hide-arrow"
                  data-bs-toggle="dropdown" aria-expanded="false" title="Actions">
                  <i class="bx bx-dots-vertical-rounded"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li>
                    <button type="button" class="dropdown-item btn-edit-patient d-flex align-items-center"
                      data-patient-id="${id}">
                      <i class="bx bx-edit me-2"></i> Modifier
                    </button>
                  </li>
                  <li>
                    <button type="button" class="dropdown-item btn-show-parametres d-flex align-items-center"
                      data-patient-code="${code}"
                      data-patient-name="${dataName}">
                      <i class="bx bx-clipboard me-2"></i> Paramètres
                    </button>
                  </li>
                  <li>
                    <button type="button" class="dropdown-item btn-delete-patient d-flex align-items-center text-danger"
                      data-patient-id="${id}"
                      data-patient-name="${dataName}">
                      <i class="bx bx-trash me-2"></i> Supprimer
                    </button>
                  </li>
                </ul>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      setupTableActions();
    }

    function formatDate(dateString) {
      if (!dateString) return '-';
      const date = new Date(dateString);
      return date.toLocaleDateString('fr-FR');
    }
  </script>

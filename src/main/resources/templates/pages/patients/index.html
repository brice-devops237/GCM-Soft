<!DOCTYPE html>
<html lang="fr" class="layout-navbar-fixed layout-menu-fixed layout-compact" data-bs-theme="light">

<head th:replace="~{fragments/head :: head}"></head>

<body>
  <div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">
      <!-- Aside -->
      <div th:replace="~{fragments/aside :: aside}"></div>

      <!-- Layout page -->
      <div class="layout-page">
        <!-- Navbar -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Content -->
        <div class="content-wrapper">
          <div class="container-xxl flex-grow-1 container-p-y">
            <div class="card">
              <div class="card-body demo-vertical-spacing demo-only-element">
                <div class="d-flex align-items-center justify-content-between">

                  <!-- Bouton Ajouter (extrême gauche) -->
                  <div>
                    <button type="button" class="btn btn-primary btn-sm px-3" data-bs-toggle="modal"
                      data-bs-target="#modalCenter">
                      <span class="bx bx-plus-circle me-1"></span> Ajouter patient
                    </button>
                  </div>

                  <!-- Filtres (extrême droite) -->
                  <div class="d-flex align-items-center gap-2">

                    <!-- Date range -->
                    <div class="input-group input-group-sm">
                      <input type="date" class="form-control" />
                      <span class="input-group-text px-2">au</span>
                      <input type="date" class="form-control" />
                    </div>

                    <!-- Search input -->
                    <input type="text" class="form-control form-control-sm" placeholder="Rechercher..." />

                    <!-- Button lancer -->
                    <button type="button" class="btn btn-primary btn-sm px-3">
                      <span class="bx bx-search-alt me-1"></span>Lancer
                    </button>

                  </div>

                </div>


              </div>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div th:replace="~{fragments/footer :: footer}"></div>
      </div>
      <!-- /Content -->
    </div>
    <!-- /Layout page -->
  </div>
  </div>


  <!-- Modal -->
  <div class="modal fade" id="modalCenter" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalCenterTitle">Enregistrer un patient</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-label-danger btn-sm" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-primary btn-sm">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>
  </div>

  <!-- Scripts -->
  <div th:replace="~{fragments/js :: js}"></div>
</body>

</html>
